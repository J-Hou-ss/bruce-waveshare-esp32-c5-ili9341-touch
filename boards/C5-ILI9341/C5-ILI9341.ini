; Bruce for the Waveshare ESP32-C5-WIFI6-KIT + 2.8" ILI9341 SPI screen with XPT2046 touch (touch only).
; Pins and wiring: pins_arduino.h in this folder. Board code: interface.cpp.
;
; Build (from the Bruce source root, one environment only):
;     pio run -e c5-ili9341
; Result: Bruce-c5-ili9341.bin, a merged image to flash at address 0x0.
;
; Needs one line in a shared Bruce file so the pin file is picked up:
;     boards/pinouts/pins_arduino.h  ->  #elif C5_ILI9341 / #include "../C5-ILI9341/pins_arduino.h"
;
; Coming from the stock esp32-c5-tft build or any other pin map: erase the flash first.
; Bruce saves its pin settings on first boot and the saved copy overrides the ones compiled in here.
[env:c5-ili9341]
board = esp32-c5-devkitc-1
board_build.partitions = custom_8Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/C5-ILI9341>
build_flags =
	${env.build_flags}
	-Iboards/C5-ILI9341
	-DDEVICE_NAME='"ESP32-C5"'
	-DC5_ILI9341=1
	-DBOARD_HAS_PSRAM=1
	-DARDUINO_USB_CDC_ON_BOOT=1  ; the Bruce serial log is on the port labelled USB, not UART
	-DARDUINO_USB_MODE=1
	-DCORE_DEBUG_LEVEL=1
	-DALLOW_ALL_GPIO_FOR_IR_RF=1
	; text sizes
	-DFP=1
	-DFM=2
	-DFG=3
	-DBTN_ALIAS='"OK"'

; Same list as [env] in platformio.ini, but with FastLED fixed at 3.10.3:
; newer FastLED uses FP as a type name, which clashes with Bruce's -DFP=1.
; The whole list is repeated because PlatformIO would otherwise install both versions.
lib_deps =
	https://github.com/sayacom/WireGuard-ESP32-Arduino#feature/esp-netif
	https://github.com/bmorcelli/IRremoteESP8266
	paulstoffregen/Time@1.6.1
	LibSSH-ESP32
	Adafruit BusIO=https://github.com/emericklaw/Adafruit-BusIO_Bruce@1.17.2-bruce.1
	Adafruit PN532=https://github.com/emericklaw/Adafruit-PN532_Bruce@1.3.3-bruce.1
	https://github.com/huckor/BER-TLV.git
	https://github.com/rennancockles/Arduino_MFRC522v2.git
	https://github.com/bmorcelli/ESP-ChameleonUltra
	https://github.com/bmorcelli/ESP-Amiibolink
	https://github.com/rennancockles/SimpleCLI
	https://github.com/whywilson/ESP-PN532BLE
	https://github.com/whywilson/ESP-PN532-UART
	https://github.com/whywilson/ESP-PN532Killer
	NTPClient@3.2.1
	ESP32Time@2.0.6
	FFat
	bblanchon/ArduinoJson
	ESP8266Audio@^2.4.1
	earlephilhower/ESP8266SAM@^1.1.0
	mikalhart/TinyGPSPlus
	tinyu-zhao/FFT@^0.0.1
	h2zero/NimBLE-Arduino@2.5
	nrf24/RF24 @ 1.4.11
